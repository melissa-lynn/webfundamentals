<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
    <title>Pizza Form</title>
</head>
<body>
<form method="GET"
      action="/cgi-bin/echo.cgi">
  <p>Customer name: <input type="text" name="customer"></p>
  <p>Telephone: <input type=tel name="phone"></p>
  <p>E-mail address: <input type=email name="addr"></p>
  <p>Size:
      <select id="select_size" name="size">
        <option value="">choose size</option>
        <option value="small">small (10-inch)</option>
        <option value="medium">medium (12-inch)</option>
        <option value="large">large (14-inch)</option>
      </select></p>
  <p>Preferred delivery time:
      <input name="due" type=time min="11:00" max="21:00" step="900">
  </p>
  <p>Delivery instructions:</p>
  <p><textarea id="textarea_instructions"
                name="instructions"
                rows="3" cols="30"></textarea></p>
  <p><button type="submit">Submit order</button></p>
</form>

</body>
</html>
